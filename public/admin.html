<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>米粿Studio 管理后台</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--surface-2:#f2f4f7;--text:#15171b;--muted:#69717d;--line:#dfe3e8;--blue:#1477e9;--blue-soft:#eaf3ff;--green:#15975f;--green-soft:#e7f7ef;--orange:#b46708;--orange-soft:#fff2df;--red:#c53b3b;--shadow:0 12px 36px rgba(22,34,51,.08)}
[data-theme="dark"]{color-scheme:dark;--bg:#111316;--surface:#191c20;--surface-2:#22262b;--text:#f4f5f7;--muted:#a1a8b1;--line:#30353b;--blue:#5da8ff;--blue-soft:#172a42;--green:#51c98e;--green-soft:#153426;--orange:#f1b45f;--orange-soft:#3a2b19;--red:#ff8585;--shadow:0 14px 40px rgba(0,0,0,.26)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;font-size:14px}.shell{min-height:100vh;display:grid;grid-template-columns:228px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 22px;font-weight:750;font-size:17px}.brand img{width:25px;height:25px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500}.nav-label{padding:14px 10px 7px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:10px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:9px}.nav button:hover{background:var(--surface-2);color:var(--text)}.nav button.active{background:var(--blue-soft);color:var(--blue);font-weight:700}.ico{width:19px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.sidefoot button{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px;cursor:pointer}.main{min-width:0}.topbar{height:66px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px}.topbar h1{font-size:16px;margin:0}.grow{flex:1}.topbtn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.statusline{font-size:11px;color:var(--muted)}.content{padding:26px 28px 50px;max-width:1500px;margin:0 auto}.heading{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}.heading h2{margin:0;font-size:25px;letter-spacing:-.03em}.heading p{margin:5px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;gap:13px}.kpis{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 1px 1px rgba(20,30,45,.02)}.kpi small{display:block;color:var(--muted);font-size:10px}.kpi b{display:block;font-size:25px;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.kpi span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.two{grid-template-columns:1fr 1fr}.cardhead{display:flex;align-items:center;margin-bottom:13px}.cardhead h3{margin:0;font-size:13px}.cardhead small{margin-left:auto;color:var(--muted)}.meterrow{display:grid;grid-template-columns:1fr 70px 48px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.meterrow:first-of-type{border-top:0}.meter{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}.pill{display:inline-flex;align-items:center;padding:3px 7px;border-radius:99px;background:var(--surface-2);font-size:10px;white-space:nowrap}.pill.ok{background:var(--green-soft);color:var(--green)}.pill.warn{background:var(--orange-soft);color:var(--orange)}.pill.bad{background:#ffeaea;color:var(--red)}.tablewrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{background:var(--surface-2);color:var(--muted);font-size:10px;text-align:left;padding:10px 12px;white-space:nowrap}.table td{padding:11px 12px;border-top:1px solid var(--line);font-size:12px;vertical-align:middle}.entity b{display:block}.entity small{display:block;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.filters{display:flex;gap:8px;margin-bottom:12px}.filters input,.filters select,.field input,.field select{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 11px;font:inherit}.filters input{min-width:260px}.notice{border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));background:var(--blue-soft);color:var(--text);border-radius:11px;padding:12px 14px;font-size:12px;margin-bottom:14px}.modelgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.model h3{margin:0}.modelname{font-size:20px;font-weight:750;margin:12px 0 4px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.fact{padding:10px;background:var(--surface-2);border-radius:9px}.fact small{display:block;color:var(--muted);font-size:9px}.fact b{font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}dialog{border:0;background:transparent;color:var(--text);padding:0}dialog::backdrop{background:rgba(12,16,22,.45);backdrop-filter:blur(3px)}dialog[open]{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;max-width:calc(100vw - 32px);max-height:calc(100dvh - 32px)}.modal{width:min(460px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px;overflow:auto}.modal h3{margin:0}.modal p{color:var(--muted);font-size:12px}.field{display:grid;gap:5px;margin-top:12px}.field label{font-size:11px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.error{color:var(--red);font-size:11px;min-height:16px;margin-top:8px}.toasts{position:fixed;right:20px;bottom:20px;z-index:20}.toast{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.shell{grid-template-columns:72px minmax(0,1fr)}.sidebar{padding-inline:8px}.brand span,.nav button span:last-child,.nav-label{display:none}.nav button{justify-content:center}.brand{padding-inline:10px}.two,.modelgrid{grid-template-columns:1fr}}@media(max-width:680px){.shell{display:block}.sidebar{position:static;height:auto;display:block;padding:10px}.brand{padding-bottom:10px}.brand span{display:block}.nav{display:flex;overflow:auto}.nav button span:last-child{display:block}.sidefoot{display:none}.topbar{padding:0 12px}.content{padding:18px 12px}.kpis{grid-template-columns:repeat(2,1fr)}.filters{overflow:auto}.filters input{min-width:190px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img src="assets/miguo-mark.png" alt=""><span>米粿Studio<small>平台管理后台</small></span></div>
    <div class="nav-label">管理</div>
    <nav class="nav" aria-label="后台页面">
      <button class="active" data-view="overview"><span class="ico">⌂</span><span>管理概览</span></button>
      <button data-view="organizations"><span class="ico">◇</span><span>组织</span></button>
      <button data-view="accounts"><span class="ico">◎</span><span>账号</span></button>
      <button data-view="tasks"><span class="ico">▤</span><span>任务与积分</span></button>
      <button data-view="models"><span class="ico">✦</span><span>模型与服务</span></button>
    </nav>
    <div class="sidefoot"><button id="returnStudio">返回工作台</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">管理概览</h1><div class="grow"></div><span class="statusline" id="freshness">正在读取…</span><button class="topbtn" id="refreshBtn">刷新</button><button class="topbtn" id="themeBtn" aria-label="切换主题">◐</button></header>
    <div class="content" id="content"><div class="empty">正在连接米粿Studio管理服务…</div></div>
  </main>
</div>

<dialog id="organizationDialog" data-admin-id="organization-dialog"><form class="modal" id="organizationForm"><h3>新建组织</h3><p>创建后可将现有账号关联到该组织。</p><div class="field"><label for="organizationName">组织名称</label><input id="organizationName" maxlength="120" required></div><div class="error" id="organizationError"></div><div class="actions"><button class="btn" type="button" data-close="organizationDialog">取消</button><button class="btn primary" type="submit">创建组织</button></div></form></dialog>
<dialog id="membershipDialog" data-admin-id="membership-dialog"><form class="modal" id="membershipForm"><h3>调整账号组织</h3><p id="membershipUser"></p><div class="field"><label for="membershipOrganization">组织</label><select id="membershipOrganization" required></select></div><div class="field"><label for="membershipRole">组织角色</label><select id="membershipRole"><option value="member">成员</option><option value="scheduler">排期</option><option value="owner">负责人</option></select></div><div class="error" id="membershipError"></div><div class="actions"><button class="btn" type="button" data-close="membershipDialog">取消</button><button class="btn primary" type="submit">保存关联</button></div></form></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
const API='./api/v1';let csrfToken='';let dashboard=null;let activeView=location.hash.slice(1)||'overview';let membershipUserId='';
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=value=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(Number(value||0));const date=value=>value?new Date(value).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const rate=value=>value==null?'—':`${value}%`;const pill=(text,type='')=>`<span class="pill ${type}">${esc(text)}</span>`;const successType=status=>status==='succeeded'?'ok':status==='failed'?'bad':['queued','running','processing'].includes(status)?'warn':'';
function toast(message){const node=document.createElement('div');node.className='toast';node.textContent=message;$('toasts').append(node);setTimeout(()=>node.remove(),3200)}
async function api(path,options={}){const headers={...(options.headers||{})};if(options.body&&!headers['content-type'])headers['content-type']='application/json';if(options.method&&options.method!=='GET')headers['x-csrf-token']=csrfToken;const response=await fetch(`${API}${path}`,{credentials:'same-origin',...options,headers});const payload=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(payload?.error?.message||'管理请求失败');error.code=payload?.error?.code;throw error}return payload}
async function bootstrap(){try{const session=await api('/auth/session');if(session.user.role!=='admin'){location.replace('./');return}csrfToken=session.csrfToken;await load()}catch(error){$('content').innerHTML=`<div class="empty">${esc(error.message)}<br><button class="btn" style="margin-top:14px" onclick="location.href='./'">返回登录</button></div>`}}
async function load(){const button=$('refreshBtn');button.disabled=true;try{dashboard=await api('/admin/dashboard');$('freshness').textContent=`更新于 ${date(dashboard.generatedAt)}`;render(activeView)}catch(error){$('content').innerHTML=`<div class="empty">后台数据读取失败：${esc(error.message)}</div>`}finally{button.disabled=false}}
const kpi=(label,value,note)=>`<article class="card kpi"><small>${label}</small><b>${value}</b><span>${note}</span></article>`;
function overview(){const s=dashboard.summary;const top=[...dashboard.organizations].sort((a,b)=>b.recordedPoints-a.recordedPoints).slice(0,6);return `<div class="heading"><div><h2>平台运营一览</h2><p>组织、账号、真实任务、积分记录和服务状态均来自当前生产数据库。</p></div></div><div class="grid kpis">${kpi('组织',fmt(s.organizationCount),'已关联团队')}${kpi('活跃账号',fmt(s.activeUserCount),'可登录账号')}${kpi('任务总量',fmt(s.taskCount),`${s.activeTaskCount} 个在途`)}${kpi('最终成功率',rate(s.successRate),`${s.failedTaskCount} 个失败`)}${kpi('已记录积分',fmt(s.recordedPoints),'按项目拥有者归因')}${kpi('团队提报',fmt(s.submissionCount),`${s.unknownCostCount} 笔费用待核对`)}</div><div class="grid two"><article class="card"><div class="cardhead"><h3>组织使用情况</h3><small>已记录积分</small></div>${top.length?top.map(item=>`<div class="meterrow"><span>${esc(item.name)}</span><div class="meter"><i style="width:${Math.min(100,item.recordedPoints/Math.max(1,top[0].recordedPoints)*100)}%"></i></div><b>${fmt(item.recordedPoints)}</b></div>`).join(''):'<div class="empty">暂无任务</div>'}</article><article class="card"><div class="cardhead"><h3>生产状态</h3><small>经典 + 分镜成稿</small></div><div class="meterrow"><span>成功任务</span><div class="meter"><i style="width:${s.successRate||0}%"></i></div><b>${fmt(s.succeededTaskCount)}</b></div><div class="meterrow"><span>失败任务</span><div></div><b>${fmt(s.failedTaskCount)}</b></div><div class="meterrow"><span>运行 / 排队</span><div></div><b>${fmt(s.activeTaskCount)}</b></div><div class="meterrow"><span>Agent 分析成功率</span><div></div><b>${rate(s.analysisSuccessRate)}</b></div></article></div>`}
function organizations(){return `<div class="heading"><div><h2>组织</h2><p>管理组织成员，查看团队任务、使用积分、成功率和提报数量。</p></div><div class="grow"></div><button class="btn primary" id="newOrganization">新建组织</button></div><div class="filters"><input id="orgSearch" placeholder="搜索组织"><select id="orgSort"><option value="activity">最近活跃</option><option value="points">积分消耗</option><option value="tasks">任务数量</option></select></div><div id="orgTable"></div>`}
function renderOrganizationTable(){const query=($('orgSearch')?.value||'').trim().toLowerCase();const sort=$('orgSort')?.value||'activity';let rows=dashboard.organizations.filter(item=>item.name.toLowerCase().includes(query));rows.sort((a,b)=>sort==='points'?b.recordedPoints-a.recordedPoints:sort==='tasks'?b.taskCount-a.taskCount:String(b.lastActivityAt||'').localeCompare(String(a.lastActivityAt||'')));$('orgTable').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>组织</th><th>成员</th><th>任务</th><th>在途</th><th>已记录积分</th><th>最终成功率</th><th>待核对</th><th>团队提报</th><th>最近活跃</th></tr></thead><tbody>${rows.map(item=>`<tr><td class="entity"><b>${esc(item.name)}</b><small>${esc(item.id)}</small></td><td>${fmt(item.member_count)}</td><td>${fmt(item.taskCount)}</td><td>${fmt(item.activeTaskCount)}</td><td><b>${fmt(item.recordedPoints)}</b></td><td>${rate(item.successRate)}</td><td>${item.unknownCostCount?pill(item.unknownCostCount,'warn'):'0'}</td><td>${fmt(item.submissionCount)}</td><td>${date(item.lastActivityAt)}</td></tr>`).join('')}</tbody></table></div>`}
function accounts(){return `<div class="heading"><div><h2>账号</h2><p>查看成员使用归因，并将账号关联到正确的组织和团队角色。</p></div></div><div class="filters"><input id="userSearch" placeholder="搜索姓名或邮箱"><select id="userRole"><option value="all">全部平台角色</option><option value="admin">管理员</option><option value="member">成员</option></select></div><div id="userTable"></div>`}
function renderUserTable(){const query=($('userSearch')?.value||'').trim().toLowerCase();const role=$('userRole')?.value||'all';const rows=dashboard.users.filter(item=>(role==='all'||item.role===role)&&`${item.displayName} ${item.email}`.toLowerCase().includes(query));$('userTable').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>账号</th><th>平台角色</th><th>所属组织</th><th>组织角色</th><th>任务</th><th>已记录积分</th><th>最终成功率</th><th>待核对</th><th>最近登录</th><th></th></tr></thead><tbody>${rows.map(item=>`<tr><td class="entity"><b>${esc(item.displayName)}</b><small>${esc(item.email)}</small></td><td>${pill(item.role==='admin'?'管理员':'成员',item.role==='admin'?'ok':'')}</td><td>${esc(item.organization?.name||'未关联')}</td><td>${esc(item.organization?.role||'—')}</td><td>${fmt(item.taskCount)}</td><td>${fmt(item.recordedPoints)}</td><td>${rate(item.successRate)}</td><td>${item.unknownCostCount?pill(item.unknownCostCount,'warn'):'0'}</td><td>${date(item.lastLoginAt)}</td><td><button class="btn" data-user="${esc(item.id)}">调整组织</button></td></tr>`).join('')}</tbody></table></div>`}
function tasks(){const rows=dashboard.recentTasks;return `<div class="heading"><div><h2>任务与积分</h2><p>积分为 Studio 已持久化的供应商费用记录；未知费用会保持冻结并阻断重复调用。</p></div></div>${dashboard.policy.balanceLedgerAvailable?'':`<div class="notice"><b>共享余额账本尚未启用。</b> 当前页面准确展示每个组织、账号的任务归因、已记录积分与待核对费用；不会伪造“可用余额”。</div>`}<div class="tablewrap"><table class="table"><thead><tr><th>时间</th><th>任务</th><th>批次</th><th>账号</th><th>工序</th><th>状态</th><th>提供方</th><th>积分</th><th>费用状态</th></tr></thead><tbody>${rows.map(item=>`<tr><td>${date(item.createdAt)}</td><td class="entity"><b>${esc(item.id.slice(0,8))}</b><small>${esc(item.kind)}</small></td><td>${esc(item.batchName)}</td><td>${esc(item.owner?.displayName||item.owner?.email||'—')}</td><td>${esc(item.stage)}</td><td>${pill(item.status,successType(item.status))}</td><td>${esc(item.provider)}</td><td>${fmt(item.points)}</td><td>${item.costSource==='unknown'?pill('待核对','warn'):esc(item.costSource)}</td></tr>`).join('')}</tbody></table></div>`}
function models(){const m=dashboard.models;const modelCard=(title,item,details)=>`<article class="card model"><div class="cardhead"><h3>${title}</h3>${pill(item.enabled?'已启用':item.configured?'已配置未启用':'未配置',item.enabled?'ok':item.configured?'warn':'bad')}</div>${details}</article>`;return `<div class="heading"><div><h2>模型与服务</h2><p>仅展示经过脱敏的当前生产配置；API Key 不会回传浏览器。</p></div></div><div class="notice">模型与 Base URL 的变更目前继续使用受保护的服务器发布流程：先校验连接与安全策略，再原子发布。后台不会把密钥保存在 localStorage，也不会提供明文读取。</div><div class="grid modelgrid">${modelCard('主模型 Agent',m.main,`<div class="modelname">${esc(m.main.interactiveModel)}</div><div class="statusline">交互理解 · ${esc(m.main.baseUrlHost||'未配置主机')}</div><div class="facts"><div class="fact"><small>批量模型</small><b>${esc(m.main.batchModel)}</b></div><div class="fact"><small>超时</small><b>${fmt(m.main.timeoutMs/1000)} 秒</b></div></div>`)}${modelCard('成稿图像服务',m.image,`<div class="modelname">${esc(m.image.model)}</div><div class="statusline">${esc(m.image.baseUrlHost||'未配置主机')}</div><div class="facts"><div class="fact"><small>分镜提供方</small><b>${esc(m.storyboardProvider)}</b></div><div class="fact"><small>超时</small><b>${fmt(m.image.timeoutMs/1000)} 秒</b></div></div>`)}${modelCard('米粿经典工作流',m.classic,`<div class="modelname">勾线 · 上色 · 光影</div><div class="statusline">连接状态由服务端安全门统一管理</div>`)}${modelCard('StoryArk 3.0',m.storyark,`<div class="modelname">分镜成稿备用链路</div><div class="statusline">项目与任务状态只由服务器读取</div>`)}</div>`}
const views={overview,organizations,accounts,tasks,models};
function render(view){activeView=views[view]?view:'overview';location.hash=activeView;document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===activeView));$('pageTitle').textContent={overview:'管理概览',organizations:'组织',accounts:'账号',tasks:'任务与积分',models:'模型与服务'}[activeView];$('content').innerHTML=views[activeView]();bindView()}
function bindView(){if(activeView==='organizations'){$('newOrganization').onclick=()=>{$('organizationError').textContent='';$('organizationName').value='';$('organizationDialog').showModal()};$('orgSearch').oninput=renderOrganizationTable;$('orgSort').onchange=renderOrganizationTable;renderOrganizationTable()}if(activeView==='accounts'){$('userSearch').oninput=renderUserTable;$('userRole').onchange=renderUserTable;renderUserTable();document.querySelectorAll('[data-user]').forEach(button=>button.onclick=()=>openMembership(button.dataset.user))}}
function openMembership(userId){const user=dashboard.users.find(item=>item.id===userId);if(!user)return;membershipUserId=userId;$('membershipUser').textContent=`${user.displayName} · ${user.email}`;$('membershipOrganization').innerHTML=dashboard.organizations.map(org=>`<option value="${esc(org.id)}" ${org.id===user.organization?.id?'selected':''}>${esc(org.name)}</option>`).join('');$('membershipRole').value=user.organization?.role||'member';$('membershipError').textContent='';$('membershipDialog').showModal()}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>render(button.dataset.view));document.querySelectorAll('[data-close]').forEach(button=>button.onclick=()=>$(button.dataset.close).close());$('returnStudio').onclick=()=>location.href='./';$('refreshBtn').onclick=load;$('themeBtn').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('mp.admin.theme',next)};document.documentElement.dataset.theme=localStorage.getItem('mp.admin.theme')||'light';
$('organizationForm').onsubmit=async event=>{event.preventDefault();try{await api('/admin/organizations',{method:'POST',body:JSON.stringify({name:$('organizationName').value})});$('organizationDialog').close();toast('组织已创建');await load()}catch(error){$('organizationError').textContent=error.message}};
$('membershipForm').onsubmit=async event=>{event.preventDefault();const organizationId=$('membershipOrganization').value;try{await api(`/admin/organizations/${encodeURIComponent(organizationId)}/members`,{method:'POST',body:JSON.stringify({email:dashboard.users.find(item=>item.id===membershipUserId)?.email,role:$('membershipRole').value})});$('membershipDialog').close();toast('账号组织已更新');await load()}catch(error){$('membershipError').textContent=error.message}};
bootstrap();
</script>
</body>
</html>
